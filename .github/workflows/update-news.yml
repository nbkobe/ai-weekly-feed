name: Update AI News

on:
  schedule:
    - cron: '0 1 * * *'  # 每天北京时间 9:00 运行
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run news scraper
        run: python scripts/fetch-news.py

      - name: Commit and push
        run: |
          git config user.name "AI Weekly Bot"
          git config user.email "bot@aiweeklyfeed.com"
          git add data/news.json
          git diff --staged --quiet || git commit -m "🤖 自动更新 AI 资讯 $(date +%Y-%m-%d)"
          git push
