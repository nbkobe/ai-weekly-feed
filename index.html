<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 导航站 - 发现最好用的AI工具</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- 粒子背景 -->
    <canvas id="particles"></canvas>
    
    <!-- 鼠标跟随光效 -->
    <div class="cursor-glow" id="cursorGlow"></div>

    <!-- 导航栏 -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <div class="logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">AI<span class="highlight">导航站</span></span>
            </div>
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="搜索AI工具..." oninput="filterTools()">
            </div>
            <div class="nav-links">
                <a href="#tools" class="nav-link">工具</a>
                <a href="#categories" class="nav-link">分类</a>
                <a href="javascript:void(0)" class="nav-link" onclick="randomPick()">🎲 试试这个</a>
            </div>
        </div>
    </nav>

    <!-- Hero区域 -->
    <section class="hero">
        <div class="hero-content">
            <h1 class="hero-title">
                <span class="title-line">发现最好用的</span>
                <span class="title-line gradient-text">AI 工具</span>
            </h1>
            <p class="hero-subtitle">精选全球优质AI工具，助你效率翻倍</p>
            <div class="hero-stats">
                <div class="stat-item">
                    <span class="stat-number" data-target="50">0</span>+
                    <span class="stat-label">精选工具</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" data-target="12">0</span>
                    <span class="stat-label">工具分类</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" data-target="100">0</span>%
                    <span class="stat-label">免费可用</span>
                </div>
            </div>
        </div>
        <div class="hero-visual">
            <div class="floating-card fc1"><i class="fas fa-robot"></i></div>
            <div class="floating-card fc2"><i class="fas fa-brain"></i></div>
            <div class="floating-card fc3"><i class="fas fa-wand-magic-sparkles"></i></div>
            <div class="floating-card fc4"><i class="fas fa-image"></i></div>
            <div class="floating-card fc5"><i class="fas fa-code"></i></div>
        </div>
    </section>

    <!-- 分类标签 -->
    <section class="categories" id="categories">
        <div class="container">
            <div class="category-tabs">
                <button class="tab-btn active" onclick="filterCategory('all')">🔥 全部</button>
                <button class="tab-btn" onclick="filterCategory('chat')">💬 对话</button>
                <button class="tab-btn" onclick="filterCategory('image')">🎨 图像</button>
                <button class="tab-btn" onclick="filterCategory('video')">🎬 视频</button>
                <button class="tab-btn" onclick="filterCategory('audio')">🎵 音频</button>
                <button class="tab-btn" onclick="filterCategory('code')">💻 编程</button>
                <button class="tab-btn" onclick="filterCategory('writing')">✍️ 写作</button>
                <button class="tab-btn" onclick="filterCategory('office')">📊 办公</button>
                <button class="tab-btn" onclick="filterCategory('design')">🎯 设计</button>
            </div>
        </div>
    </section>

    <!-- 工具卡片网格 -->
    <section class="tools-section" id="tools">
        <div class="container">
            <div class="tools-grid" id="toolsGrid"></div>
        </div>
    </section>

    <!-- 随机推荐弹窗 -->
    <div class="modal-overlay" id="randomModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div class="modal-icon" id="modalIcon"></div>
            <h2 id="modalTitle"></h2>
            <p id="modalDesc"></p>
            <a id="modalLink" href="#" target="_blank" class="modal-btn">立即使用 →</a>
            <button class="modal-btn secondary" onclick="randomPick()">🎲 换一个</button>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <p>⚡ AI导航站 — 精选全球优质AI工具</p>
            <p class="footer-sub">每周更新 · 持续收录最新AI神器</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
