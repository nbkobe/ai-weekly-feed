// ============ 渲染逻辑 ============
function renderTools(tools) {
  const container = document.getElementById('toolSections');
  container.innerHTML = '';
  const cats = Object.keys(CATEGORIES);
  cats.forEach(catKey => {
    const catTools = tools.filter(t => t.cat === catKey);
    if (catTools.length === 0) return;
    const cat = CATEGORIES[catKey];
    const sec = document.createElement('section');
    sec.className = 'category-section';
    sec.innerHTML = `
      <div class="cat-header">
        <span class="cat-emoji">${cat.emoji}</span>
        <h2 class="cat-title">${cat.title}</h2>
        <span class="cat-count">${catTools.length}</span>
      </div>
      <div class="tool-grid">
        ${catTools.map(t => `
          <a href="${t.url}" target="_blank" class="tool-card" data-name="${t.name.toLowerCase()}" data-desc="${t.desc.toLowerCase()}">
            <div class="card-top-row">
              <div class="tool-icon-wrap">${t.icon}</div>
              <div class="tool-tags">
                ${t.tags.map(tag => `<span class="tag tag-${tag}">${tag === 'cn' ? '中文' : tag === 'en' ? 'EN' : tag === 'hot' ? '🔥 热门' : tag === 'free' ? '免费' : tag === 'new' ? 'NEW' : tag}</span>`).join('')}
              </div>
            </div>
            <div class="tool-name">${t.name}</div>
            <div class="tool-desc">${t.desc}</div>
          </a>
        `).join('')}
      </div>`;
    container.appendChild(sec);
  });
}

function filterTools() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const cards = document.querySelectorAll('.tool-card');
  cards.forEach(c => {
    const match = c.dataset.name.includes(q) || c.dataset.desc.includes(q);
    c.style.display = match ? '' : 'none';
  });
  document.querySelectorAll('.category-section').forEach(sec => {
    const visible = sec.querySelectorAll('.tool-card[style=""], .tool-card:not([style])');
    let count = 0;
    sec.querySelectorAll('.tool-card').forEach(c => { if (c.style.display !== 'none') count++; });
    sec.style.display = count > 0 ? '' : 'none';
  });
}

// ============ 资讯加载 ============
async function loadNews() {
  const grid = document.getElementById('newsGrid');
  grid.innerHTML = '<div class="news-loading">正在获取最新AI资讯...</div>';
  try {
    const res = await fetch('https://aihot.virxact.com/api/v1/items?mode=selected');
    const data = await res.json();
    const items = (data.items || []).slice(0, 12);
    if (items.length === 0) { grid.innerHTML = '<div class="news-loading">暂无最新资讯</div>'; return; }
    grid.innerHTML = items.map(item => `
      <a href="${item.url || '#'}" target="_blank" class="news-item">
        <div class="news-item-title">${item.title || '无标题'}</div>
        <div class="news-item-desc">${item.summary || item.desc || ''}</div>
        <div class="news-item-meta">
          <span class="news-tag">${item.source || 'AI'}</span>
          <span>${item.time || ''}</span>
        </div>
      </a>
    `).join('');
  } catch (e) {
    grid.innerHTML = '<div class="news-loading">资讯加载失败，请稍后重试</div>';
  }
}

// ============ 千里江山粒子背景 ============
const canvas = document.getElementById('landscape');
const ctx = canvas.getContext('2d');
let W, H, particles = [], mountains = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  initMountains();
}

function initMountains() {
  mountains = [];
  const layers = [
    { base: H * 0.55, amp: 80, freq: 0.003, color: 'rgba(10, 80, 90, 0.6)', speed: 0.15 },
    { base: H * 0.65, amp: 60, freq: 0.005, color: 'rgba(15, 100, 100, 0.4)', speed: 0.25 },
    { base: H * 0.75, amp: 40, freq: 0.008, color: 'rgba(20, 120, 110, 0.3)', speed: 0.35 },
    { base: H * 0.85, amp: 25, freq: 0.012, color: 'rgba(25, 130, 120, 0.2)', speed: 0.5 },
  ];
  layers.forEach(l => {
    const pts = [];
    for (let x = 0; x <= W + 200; x += 3) {
      const y = l.base + Math.sin(x * l.freq) * l.amp + Math.sin(x * l.freq * 2.5) * l.amp * 0.4;
      pts.push({ x, y });
    }
    mountains.push({ pts, ...l });
  });
}

function initParticles() {
  particles = [];
  for (let i = 0; i < 120; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.7,
      r: Math.random() * 2 + 0.5,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.2,
      alpha: Math.random() * 0.6 + 0.2,
      color: ['#00d4aa', '#0ea5e9', '#d4a843', '#4ecdc4'][Math.floor(Math.random() * 4)]
    });
  }
}

function drawBg() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#020a14');
  grad.addColorStop(0.4, '#051828');
  grad.addColorStop(0.7, '#0a2a3a');
  grad.addColorStop(1, '#0d3545');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawMountains(offset) {
  mountains.forEach(m => {
    ctx.beginPath();
    ctx.moveTo(-10, H);
    m.pts.forEach(p => {
      ctx.lineTo(p.x + offset * m.speed, p.y);
    });
    ctx.lineTo(W + 10, H);
    ctx.closePath();
    ctx.fillStyle = m.color;
    ctx.fill();
  });
}

function drawParticles() {
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    if (p.x < 0) p.x = W;
    if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H * 0.6;
    if (p.y > H * 0.7) p.y = 0;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.alpha;
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

let mountainOffset = 0;
function animate() {
  drawBg();
  mountainOffset += 0.3;
  drawMountains(mountainOffset);
  drawParticles();
  requestAnimationFrame(animate);
}

window.addEventListener('resize', resize);
resize();
initParticles();
animate();
